[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["wsgi"]

[project]
name = "studybud"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<6",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.3",
]

[project.scripts]
app = "wsgi:app"
